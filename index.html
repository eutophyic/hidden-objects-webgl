<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hidden-objects</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #29292d;
      font-family: system-ui, sans-serif;
    }
    .phone {
      /* Outer 414:868 ratio leaves a 390:844 screen inside the bezel. */
      width: min(470px, calc(100vw - 32px), calc((100vh - 32px) * 414 / 868));
      width: min(470px, calc(100vw - 32px), calc((100dvh - 32px) * 414 / 868));
      aspect-ratio: 414 / 868;
      padding: 0;
      position: relative;
      border-radius: 13.5% / 6.44%;
      background: #111;
      box-shadow: 0 24px 60px #0008;
    }
    .screen {
      position: absolute;
      inset: 1.3825% 2.899%;
      overflow: hidden;
      border-radius: 11.8% / 5.45%;
      background: #fff0cf;
    }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .island, .home { position: absolute; z-index: 2; pointer-events: none; }
    .island {
      top: 1.2%; left: 36%; width: 28%; height: 3.9%;
      border-radius: 999px; background: #000;
    }
    .home {
      bottom: 0.9%; left: 34%; width: 32%; height: 0.5%;
      border-radius: 999px; background: #332d22a6;
    }
    #loading, #warning {
      position: absolute; z-index: 3; left: 10%; width: 80%;
      text-align: center; color: #5b3b20;
    }
    #loading { top: 46%; }
    progress { display: block; width: 100%; margin-top: 12px; accent-color: #eea126; }
    #warning {
      top: 12%; padding: 12px; border-radius: 12px;
      background: #fff3eb; max-height: 70%; overflow: auto; overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="phone" aria-label="iPhone oyun ekranı">
    <div class="screen">
      <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="Oyun"></canvas>
      <div class="island" aria-hidden="true"></div>
      <div class="home" aria-hidden="true"></div>
      <div id="loading" role="status">Yükleniyor…<progress id="progress" max="1" value="0" aria-label="Yükleme ilerlemesi"></progress></div>
      <div id="warning" role="alert" hidden></div>
    </div>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const warning = document.querySelector('#warning');
    function showBanner(message, type) {
      warning.textContent = message;
      warning.hidden = false;
      if (type === 'error') loading.hidden = true;
    }
    const config = {
      arguments: [],
      dataUrl: "Build/hidden-objects-webgl.data.unityweb",
      frameworkUrl: "Build/hidden-objects-webgl.framework.js.unityweb",
      codeUrl: "Build/hidden-objects-webgl.wasm.unityweb",
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "eutophyic",
      productName: "hidden-objects",
      productVersion: "1.0",
      showBanner,
    };
    const loader = document.createElement('script');
    loader.src = "Build/hidden-objects-webgl.loader.js";
    loader.onerror = () => showBanner('Oyun dosyaları yüklenemedi. Bağlantıyı kontrol edip sayfayı yenileyin.', 'error');
    loader.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.querySelector('#progress').value = progress;
      }).then(() => {
        loading.hidden = true;
      }).catch(message => showBanner(String(message), 'error'));
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
